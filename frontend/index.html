<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1020">
    <title>SAMPC - Touchpad Remoto</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-shell">
        <div class="top-bar">
            <p id="status" class="status disconnected">
                <span class="status-dot"></span>
                <span id="status-text">Conectando…</span>
            </p>
            <button id="btn-niri" class="niri-btn" title="Acciones niri" aria-label="Acciones niri" hidden>▦</button>
            <button id="btn-fullscreen" class="fullscreen-btn" title="Pantalla completa" aria-label="Pantalla completa">⛶</button>
        </div>

        <main class="remote-layout">
            <section class="actions-column" aria-label="Botones de acción">
                <button id="btn-l2" class="action-btn" aria-label="Acción L2 (Esc)">L2</button>
                <button id="btn-l1" class="action-btn" aria-label="Acción L1 (Enter)">L1</button>
            </section>

            <section class="touchpad-column">
                <div id="touchpad" class="touchpad" role="application" aria-label="Touchpad remoto">
                    <span id="mode-indicator" class="mode-indicator">CURSOR</span>
                </div>
            </section>
        </main>

        <section class="bottom-controls" aria-label="Clicks y modo">
            <button id="btn-left-click" class="control-btn" aria-label="Click izquierdo">click izq</button>
            <button id="btn-mode-toggle" class="control-btn mode-btn" title="Cambiar entre modo cursor y scroll" aria-label="Cambiar de modo">🖱️</button>
            <button id="btn-right-click" class="control-btn" aria-label="Click derecho">click der</button>
        </section>
    </div>

    <!-- Panel de acciones niri -->
    <div id="niri-overlay" class="niri-overlay" hidden>
        <div class="niri-sheet" role="dialog" aria-modal="true" aria-label="Acciones niri">
            <div class="niri-sheet-head">
                <h2>Acciones niri</h2>
                <button id="niri-close" class="niri-close" aria-label="Cerrar">✕</button>
            </div>
            <div class="niri-tabs" role="tablist">
                <button class="niri-tab active" data-tab="ventana" role="tab">Ventana</button>
                <button class="niri-tab" data-tab="columnas" role="tab">Columnas</button>
                <button class="niri-tab" data-tab="monitores" role="tab">Monitores</button>
                <button class="niri-tab" data-tab="escritorios" role="tab">Escritorios</button>
            </div>
            <div class="niri-body">
                <section class="niri-pane active" id="pane-ventana" role="tabpanel">
                    <div class="niri-grid">
                        <button class="niri-action" data-action="close-window">Cerrar ventana</button>
                        <button class="niri-action" data-action="fullscreen-window">Pantalla completa</button>
                        <button class="niri-action" data-action="center-window">Centrar</button>
                        <button class="niri-action" data-action="toggle-window-floating">Flotante</button>
                        <button class="niri-action" data-action="focus-window-previous">Ventana previa</button>
                    </div>
                </section>
                <section class="niri-pane" id="pane-columnas" role="tabpanel">
                    <div class="niri-grid">
                        <button class="niri-action" data-action="focus-column-left">← Columna</button>
                        <button class="niri-action" data-action="focus-column-right">Columna →</button>
                        <button class="niri-action" data-action="focus-column-first">1ª columna</button>
                        <button class="niri-action" data-action="focus-column-last">Última columna</button>
                        <button class="niri-action" data-action="move-column-left">Mover col. ←</button>
                        <button class="niri-action" data-action="move-column-right">Mover col. →</button>
                        <button class="niri-action" data-action="toggle-column-tabbed-display">Tabs</button>
                        <button class="niri-action" data-action="consume-window-into-column">Meter ventana</button>
                        <button class="niri-action" data-action="expel-window-from-column">Sacar ventana</button>
                    </div>
                </section>
                <section class="niri-pane" id="pane-monitores" role="tabpanel">
                    <div class="niri-grid">
                        <button class="niri-action" data-action="focus-monitor-left">← Monitor</button>
                        <button class="niri-action" data-action="focus-monitor-right">Monitor →</button>
                        <button class="niri-action" data-action="focus-monitor-up">↑ Monitor</button>
                        <button class="niri-action" data-action="focus-monitor-down">↓ Monitor</button>
                    </div>
                </section>
                <section class="niri-pane" id="pane-escritorios" role="tabpanel">
                    <div class="niri-grid">
                        <button class="niri-action" data-action="focus-workspace-down">Escritorio ↓</button>
                        <button class="niri-action" data-action="focus-workspace-up">Escritorio ↑</button>
                        <button class="niri-action" data-action="focus-workspace-previous">Escritorio previo</button>
                    </div>
                    <div id="niri-workspaces" class="niri-chips"></div>
                </section>
            </div>
            <div class="niri-footer">
                <button class="niri-action niri-accent" data-action="open-terminal">Kitty</button>
                <button class="niri-action" data-action="screenshot">Captura</button>
                <button class="niri-action" data-action="toggle-overview">Overview</button>
                <button class="niri-action niri-danger" data-action="quit">Salir</button>
            </div>
        </div>

        <div id="niri-confirm" class="niri-confirm" hidden>
            <div class="niri-confirm-box">
                <p>¿Salir de la sesión de niri? Se perderán los cambios sin guardar.</p>
                <div class="niri-confirm-actions">
                    <button id="niri-confirm-no" class="niri-action">Cancelar</button>
                    <button id="niri-confirm-yes" class="niri-action niri-danger">Sí, salir</button>
                </div>
            </div>
        </div>
    </div>

    <script src="vendor/socket.io.min.js"></script>
    <script src="script.js?v=6"></script>
</body>
</html>
